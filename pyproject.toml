[project]
name = "qlora-vllm-pipeline"
version = "0.1.0"
description = "QLoRA fine-tune -> evaluate -> merge -> quantize -> serve with vLLM, with rigorous before/after benchmarks."
readme = "README.md"
requires-python = ">=3.11,<3.12"

# ---------------------------------------------------------------------------
# CPU / dev dependencies. These import and run on an Apple-Silicon Mac so the
# whole pipeline can be smoke-tested with a tiny model before paying for a GPU.
# CUDA-only packages (bitsandbytes, vllm, autoawq, flash-attn) live in the
# optional [gpu] group below and are NOT installed on the dev machine.
# ---------------------------------------------------------------------------
dependencies = [
    "torch>=2.3,<2.6",
    "transformers>=4.44,<4.48",
    "trl>=0.11,<0.13",
    "peft>=0.12,<0.14",
    "datasets>=2.20,<3.2",
    "accelerate>=0.33,<1.3",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "evaluate>=0.4.2",
    "rouge-score>=0.1.2",
    "numpy<2.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Installed only on the CUDA GPU box (see docker/Dockerfile.train).
gpu = [
    "bitsandbytes>=0.43",
    "autoawq>=0.2.5",
    "wandb>=0.17",
    "trackio>=0.1; python_version >= '3.10'",
]
# vLLM is installed in its own serving image (docker/Dockerfile.serve).
serve = [
    "vllm>=0.6.0",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["train", "eval", "serve", "export", "data"]
