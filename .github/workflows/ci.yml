name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Ruff lint
        run: ruff check common train serve eval export tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # CPU-only install: the GPU extras (bitsandbytes, autoawq, vLLM) are not
      # needed for the unit suite, which smoke-tests config, data, prompt, and
      # metric helpers on CPU before any GPU spend.
      - name: Install (CPU dev deps)
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
