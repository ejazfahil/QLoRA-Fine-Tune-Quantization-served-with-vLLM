# Serving stack: vLLM (adapter-enabled) + Prometheus + Grafana.
# Requires the NVIDIA Container Toolkit on the host (GPU passthrough).
services:
  vllm:
    build:
      context: .
      dockerfile: docker/Dockerfile.serve
    image: qlora-vllm-serve
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/workspace/outputs
    # Adjust the run/route to your trained adapter directory.
    command: >
      --model mistralai/Mistral-7B-v0.3
      --enable-lora
      --lora-modules mistral-ft=/workspace/outputs/mistral7b-dolly-qlora/adapter
      --max-lora-rank 16
      --max-model-len 4096
      --gpu-memory-utilization 0.90
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - vllm

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
